<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Slowed Enhanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Monaco', 'Consolas', monospace;
            line-height: 1.6;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .terminal {
            background: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }

        .title-bar {
            background: #2d2d2d;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #3d3d3d;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .close { background: #ff5f57; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #28ca42; }

        .window-title {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #7a7a7a;
            margin-right: 60px;
            font-weight: 400;
        }

        .content {
            padding: 30px 40px 40px;
            color: #d4d4d4;
        }

        .prompt {
            color: #4a9eff;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .command {
            color: #8ab4f8;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        h1 {
            color: #50fa7b;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .section {
            margin-bottom: 25px;
            padding-left: 20px;
            border-left: 3px solid #4a9eff;
        }

        .label {
            color: #50fa7b;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .value {
            color: #d4d4d4;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 5px;
        }

        .checkmark {
            color: #50fa7b;
            margin-right: 10px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #3d3d3d;
            color: #7a7a7a;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #50fa7b;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="title-bar">
            <div class="window-controls">
                <div class="window-control close"></div>
                <div class="window-control minimize"></div>
                <div class="window-control maximize"></div>
            </div>
            <div class="window-title">slowed-enhanced -- made by shaaf yousaf</div>
        </div>
        <div class="content">
            <div class="prompt">$ ./privacy-policy</div>
            
            <h1>Privacy Policy</h1>
            
            <div class="section">
                <div class="label">data_collection:</div>
                <div class="value"><span class="checkmark">✓</span>This extension does not collect, store, or transmit any user data.</div>
            </div>
            
            <div class="section">
                <div class="label">data_storage:</div>
                <div class="value"><span class="checkmark">✓</span>All settings are saved locally on your device.</div>
            </div>
            
            <div class="footer">
                <div class="footer-indicator">
                    <div class="dot"></div>
                    <span>last updated: october 16, 2025</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
